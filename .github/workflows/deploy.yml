name: Deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-abm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /root/abm_aggregator

            # Обновляем код (локальный .env не трогается — он в .gitignore)
            git fetch origin main
            git reset --hard origin/main

            # Собираем и перезапускаем стек прямо на сервере
            docker compose -f docker-compose.server.yml up -d --build --remove-orphans

            # Чистим висячие образы, чтобы не забивать диск
            docker image prune -f

            # Проверка, что всё живо
            sleep 5
            docker compose -f docker-compose.server.yml ps
